[project]
name = "botko"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django",
    "gunicorn",
    "psycopg[binary]",
    "django-environ",
    "potatoq[postgres]==26.1a2",
    "sentry-sdk",
    "slack_bolt",
    "urllib3",
    # Dev
    "freezegun",
    "mypy",
    "pytest",
    "pytest-django",
    "pytest-watcher",
    "ruff"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "botko.settings"

[tool.mypy]
# Generated by makemigrations.
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# No type information published by these libraries.
module = ["django.*", "environ.*"]
ignore_missing_imports = true
