name: Test & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      with:
        version: "latest"
    - name: Lint
      run: |
        uv run ruff check
        uv run ruff format --check
        uv run mypy .
    - name: Run the pre-commit hooks
      # mypy already ran above: the hook's isolated environment can't type check the project
      env:
        SKIP: mypy
      run: uvx pre-commit run --all-files --show-diff-on-failure
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: botko
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/botko"
      SLACK_BOT_TOKEN: "test-token"
      SLACK_SIGNING_SECRET: "test-secret"
    steps:
    - uses: actions/checkout@v4
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      with:
        enable-cache: true
        version: "latest"
    - name: Install dependencies
      run: uv sync --locked
    - name: Test with pytest
      run: uv run pytest
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          bash projects/botko/.deploy/update.sh
    - uses: actions/checkout@v4
      with:
        # The release's commits resolve the Sentry issues they name ("Fixes BOTKO-123")
        fetch-depth: 0
    - name: Create Sentry release
      uses: getsentry/action-release@v3
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: anze3db
        SENTRY_PROJECT: botko
      with:
        environment: production
        # update.sh deploys with git pull, so the SDK reports the deployed commit's SHA as its release
        release: ${{ github.sha }}
